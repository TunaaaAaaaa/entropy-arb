name: entropy-research
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: entropy_owner
      POSTGRES_DB: entropy_research
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entropy_owner -d entropy_research"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
secrets:
  pg_password:
    file: ./data/local/pg_password
volumes:
  postgres_data:
